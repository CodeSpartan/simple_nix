# Ayu Dark -- shared palette from kitty.conf and README.md.
# Requires a truecolor terminal (Kitty) and MC built with S-Lang.
# Color pairs: foreground;background;attributes. Empty fields inherit defaults.

[skin]
    description = Ayu Dark
    truecolors = true

[aliases]
    bg = #0B0E14
    surface = #14171D
    border = #1A1D23
    selection = #20232B
    fg = #B8B5AC
    dim = #3D4046
    accent = #FF8F40
    red = #F07178
    green = #AAD94C
    yellow = #E6C54C
    blue = #59C2FF
    purple = #D2A6FF
    cyan = #39BAE6
    mint = #80DDB8
    gold = #C4B070

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = fg;bg
    selected = accent;selection
    marked = yellow;bg;bold
    markselect = yellow;selection;bold
    gauge = bg;green
    input = fg;bg
    inputunchanged = fg;bg
    inputmark = accent;selection
    inputhistory = accent;bg
    commandhistory = accent;bg
    commandlinemark = accent;selection
    disabled = dim;surface
    reverse = accent;surface
    header = accent;bg
    shadow = dim;bg

[dialog]
    _default_ = fg;surface
    dfocus = accent;selection
    dhotnormal = accent;surface;underline
    dhotfocus = accent;selection;underline
    dtitle = accent;surface;bold

[error]
    _default_ = fg;surface
    errdfocus = bg;red
    errdhotnormal = red;surface;underline
    errdhotfocus = bg;red;underline
    errdtitle = red;surface;bold

[filehighlight]
    directory = blue;;bold
    executable = green
    symlink = cyan
    hardlink = mint
    stalelink = red;;bold
    device = purple
    special = yellow
    core = red
    temp = dim
    archive = accent
    doc = gold
    source = mint
    media = purple
    graph = cyan
    database = yellow

[menu]
    _default_ = fg;surface
    menusel = accent;selection
    menuhot = accent;surface;underline
    menuhotsel = accent;selection;underline
    menuinactive = fg;surface

[popupmenu]
    _default_ = fg;surface
    menusel = accent;selection
    menutitle = accent;surface;bold

[buttonbar]
    hotkey = accent;surface
    button = fg;surface

[statusbar]
    _default_ = fg;surface

[help]
    _default_ = fg;surface
    helpitalic = mint;surface
    helpbold = yellow;surface;bold
    helplink = blue;surface;underline
    helpslink = accent;selection
    helptitle = accent;surface;bold

[editor]
    _default_ = fg;bg
    editbold = yellow;bg;bold
    editmarked = accent;selection
    editwhitespace = dim;bg
    editnonprintable = red;bg
    editlinestate = fg;surface
    bookmark = bg;blue
    bookmarkfound = bg;yellow
    editrightmargin = dim;surface
    editbg = fg;surface
    editframe = dim;bg
    editframeactive = accent;bg
    editframedrag = yellow;bg

[viewer]
    _default_ = fg;bg
    viewbold = yellow;bg;bold
    viewunderline = blue;bg;underline
    viewselected = accent;selection

[diffviewer]
    _default_ = fg;bg
    added = bg;green
    changedline = fg;surface
    changednew = bg;yellow
    changed = bg;accent
    removed = red;border
    error = bg;red

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ×
