; nomacs first-run defaults. Shipped next to the nomacs binary (programs.nix);
; nomacs copies these into ~/.config/nomacs/Image Lounge.conf only when that
; file doesn't exist yet (fresh install). After that, change settings in the
; app -- edits here don't touch an existing config.

[DisplaySettings]
themeName312=Dark-Theme.css
bgColorNoMacsRGBA=4281545523
bgColorWidgetRGBA=2852126720
fgColorNoMacsRGBA=4292730333
fontColorRGBA=4292730333
highlightColorRGBA=4278216379
iconColorRGBA=4292730333
; 2 = never keep zoom: big images fit the window, small ones stay at 100%
keepZoom=2

[GlobalSettings]
; plain wheel switches images, Ctrl+wheel zooms
zoomOnWheel=false
; default true: only *horizontal* wheel switches images, vertical does nothing
horZoomSkips=false
; hide the faint nomacs logo in the bottom-right corner
showBgImage=false

[SynchronizeSettings]
; Linux default swaps Ctrl and Alt for mouse actions
switchModifier=false

[zooming]
; Ctrl+wheel jumps between these zoom steps instead of +10% per notch
useLevels=true
zoomLevels="0.02,0.05,0.1,0.15,0.2,0.25,0.333,0.5,0.667,1,1.5,2,3,4,6,8,12,16,24,32,64"
