general {
    # No lock screen: `loginctl lock-session` and sleep hooks just turn the
    # monitor back on (suspend is masked anyway, see hardware.nix).
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Monitor off after 15 minutes idle; any mouse/key input turns it back on.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
