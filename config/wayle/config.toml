# Wayle -- status bar / desktop shell (replaces HyprPanel, archived upstream).
#
# Hot-reloaded: saving this file re-styles the running bar, no restart needed.
# Adding or removing a module from the layout does need `wayle panel restart`.
# `wayle panel settings` opens a GUI that writes back to this same file.
# Full option reference: `wayle config default` / https://wayle.app/config/
#
# Ayu Dark palette -- see README.md "Theme" for the shared color roles.

# Machine-local overrides that must not be committed (weather location).
# Paths resolve relative to the *symlink* at ~/.config/wayle/, NOT to this file
# in the repo, so local.toml lives at ~/.config/wayle/local.toml and can never
# be committed by accident. A missing import is not an error, so a fresh clone
# works without it. See local.toml.example.
imports = ["local.toml"]

# HyprPanel ran the bar in JetBrainsMono Nerd Font Propo at weight 500, not the
# system sans -- keep that or the bar reads as a different typeface.
[general]
font-sans = "JetBrainsMono Nerd Font Propo"
font-mono = "JetBrainsMono Nerd Font"

# --- Bar geometry and chrome ---
# Flush to the top edge, square corners, hairline border, and buttons with no
# pill background (icon + label only).
[bar]
location = "top"
exclusive = true
layer = "top"
bg = "bg-base"
rounding = "none"
border-location = "all"
border-width = 1
border-color = "#1A1D23"
button-variant = "basic"
button-rounding = "none"
button-bg-opacity = 0
button-label-weight = "medium"
# 1.15 here and 0.889 on the workspaces module put every label in the bar at the
# same measured cap height (20px), which is what HyprPanel did via
# `workspaces.fontSize = 1em`. Wayle derives the two from different bases.
button-label-size = 1.15
# `button-gap` is the icon-to-label gap, NOT the gap between buttons -- that one
# is `module-gap`. Both left at defaults; tightening button-gap crowds the icon
# against its text.

[[bar.layout]]
monitor = "*"
left = ["dashboard", "hyprland-workspaces"]
center = ["clock", "weather"]
right = [
    "cpu",
    "ram",
    "storage",
    "volume",
    "network",
    "systray",
    "keyboard-input",
    "notifications",
]

# --- Theme ---
# Static palette (no wallpaper-derived theming), so `theme-provider = "wayle"`.
# Modules not listed below inherit these semantic slots, which keeps any module
# added later on-palette without extra config.
[styling]
theme-provider = "wayle"
rounding = "none"

[styling.palette]
bg = "#0B0E14"
surface = "#14171D"
elevated = "#1A1D23"
fg = "#B8B5AC"
fg-muted = "#3D4046"
primary = "#FF8F40"
red = "#F07178"
yellow = "#E6C54C"
green = "#AAD94C"
blue = "#59C2FF"

# --- Modules ---
# Ayu purple (#D2A6FF) has no slot in Wayle's 10-color palette, so the modules
# that used it in HyprPanel carry the hex inline.
#
# `thresholds` entries are checked in order and the last match wins, so the
# warn entry must come before the crit entry.

[modules.dashboard]
icon-color = "accent"
dropdown-lock-command = "loginctl lock-session"

[modules.hyprland-workspaces]
# HyprPanel: hideUnoccupied = true -> min-workspace-count 0 shows only
# active + occupied workspaces.
min-workspace-count = 0
label-size = 0.889
active-indicator = "underline"
active-color = "#D2A6FF"
occupied-color = "red"
empty-color = "blue"
container-bg-color = "transparent"

[modules.clock]
format = "%a %b %d  %H:%M:%S"
icon-color = "#D2A6FF"
label-color = "#D2A6FF"

# Location comes from ~/.config/wayle/local.toml so it stays out of git.
# open-meteo needs no API key.
[modules.weather]
provider = "open-meteo"
units = "metric"
icon-color = "yellow"
label-color = "yellow"

# `{{ percent }}` renders zero-padded to two digits ("01%"); `| int` strips it.
[modules.cpu]
format = "{{ percent | int }}%"
icon-color = "#D2A6FF"
label-color = "#D2A6FF"
left-click = "missioncenter"

[[modules.cpu.thresholds]]
above = 70
icon-color = "yellow"
label-color = "yellow"

[[modules.cpu.thresholds]]
above = 90
icon-color = "red"
label-color = "red"

[modules.ram]
format = "{{ percent | int }}%"
icon-color = "accent"
label-color = "accent"
left-click = "missioncenter"

[[modules.ram.thresholds]]
above = 75
icon-color = "yellow"
label-color = "yellow"

[[modules.ram.thresholds]]
above = 90
icon-color = "red"
label-color = "red"

[modules.storage]
mount-point = "/"
format = "{{ percent | int }}%"
icon-color = "blue"
label-color = "blue"
left-click = "missioncenter"

[[modules.storage.thresholds]]
above = 80
icon-color = "yellow"
label-color = "yellow"

[[modules.storage.thresholds]]
above = 90
icon-color = "red"
label-color = "red"

# netstat is deliberately NOT in the layout. `{{ down_auto }}` switches units
# (594 B -> 107.2 KiB), so the button's width changes every poll and shoves the
# whole right-hand side sideways. The config below is the fixed version --
# arrows to disambiguate up/down and a fixed unit so the width is stable. Note
# `{{ "%.1f" | format(x) }}` does NOT work here: the format filter exists for
# custom modules only, and using it silently blanks the label. To re-enable,
# add "netstat" back to bar.layout.right.
[modules.netstat]
format = "{{ down_mib }}↓ {{ up_mib }}↑"
icon-color = "green"
label-color = "green"

[modules.volume]
format = "{{ percent | int }}%"
icon-color = "yellow"
label-color = "yellow"

[modules.network]
icon-color = "#D2A6FF"
label-color = "#D2A6FF"

[modules.systray]
button-bg-color = "transparent"

[modules.keyboard-input]
icon-color = "blue"
label-color = "blue"

[modules.keyboard-input.layout-alias-map]
# kb_layout = us,ru in config/hypr/user.conf
"English (US)" = "US"
"Russian" = "RU"

[modules.notifications]
icon-color = "blue"
label-color = "blue"

# --- Wallpaper ---
# hyprpaper owns the wallpaper (config/hypr/hyprpaper.conf); keep Wayle's
# engine off so the two don't fight over the background surface.
[wallpaper]
engine-enabled = false
